version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Terminal/report output: a failed write to stdout/stderr has no
      # useful recovery, matching the standard library's own fmt usage.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G304 # reading user-named files is the tool's purpose
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: unused-parameter
        - name: redefines-builtin-id
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam, revive]
formatters:
  enable:
    - gofmt
    - goimports
